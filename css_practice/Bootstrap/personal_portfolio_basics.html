<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="personal_portfolio_basics.css">
</head>

<body class="bg-light text-dark">

    <header class="container text-center mt-4 mb-3">
        <h1 class="fw-bold">Madhav Kumar</h1>
        <p class="lead">
            Data Science & AI Student | Aspiring Data Analyst
        </p>
    </header>

    <main>

        <section class="container text-center py-5">

            <!-- img-fluid makes image responsive -->
            <img
                src="https://i.pravatar.cc/300"
                class="img-fluid rounded-circle profile-image mb-4"
                alt="Profile photo"
            >

            <h2 class="fw-bold">
                Hello, I'm Madhav
            </h2>

            <p class="lead mx-auto portfolio-text">
                I enjoy working with data, Python, SQL and modern
                web technologies to build useful digital solutions.
            </p>

            <div class="mb-4">
                <a href="#" class="btn btn-primary me-2">
                    Hire Me
                </a>

                <a href="#" class="btn btn-outline-dark">
                    Download CV
                </a>
            </div>

            <!-- Contact form -->
            <form class="mx-auto contact-form text-start">

                <h3 class="text-center mb-3">
                    Contact Me
                </h3>

                <input
                    type="text"
                    class="form-control mb-3"
                    placeholder="Your Name"
                >

                <input
                    type="email"
                    class="form-control mb-3"
                    placeholder="Your Email"
                >

                <textarea
                    class="form-control mb-3"
                    rows="4"
                    placeholder="Your Message"
                ></textarea>

                <button class="btn btn-dark w-100">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <footer class="text-center py-4 bg-dark text-white">
        <p class="mb-0">
            &copy; 2026 Madhav Kumar
        </p>
    </footer>

</body>
</html>
