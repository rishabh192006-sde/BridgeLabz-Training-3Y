<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="product_catalog.css">
</head>

<body>

    <header class="bg-dark text-white text-center py-4">
        <h1>TechStore</h1>
        <p class="mb-0">Smart products for everyday life</p>
    </header>

    <main class="container py-5">

        <h2 class="text-center mb-4">
            Featured Products
        </h2>

        <!-- Bootstrap row and responsive columns -->
        <section class="row g-4">

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card h-100 shadow-sm product-card">
                    <img
                        src="https://picsum.photos/id/1/500/350"
                        class="card-img-top"
                        alt="Laptop"
                    >

                    <div class="card-body">
                        <h5 class="card-title">Laptop</h5>
                        <p class="card-text">₹65,000</p>
                        <button class="btn btn-primary w-100">
                            Add to Cart
                        </button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card h-100 shadow-sm product-card">
                    <img
                        src="https://picsum.photos/id/20/500/350"
                        class="card-img-top"
                        alt="Headphones"
                    >

                    <div class="card-body">
                        <h5 class="card-title">Headphones</h5>
                        <p class="card-text">₹3,999</p>
                        <button class="btn btn-primary w-100">
                            Add to Cart
                        </button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card h-100 shadow-sm product-card">
                    <img
                        src="https://picsum.photos/id/96/500/350"
                        class="card-img-top"
                        alt="Camera"
                    >

                    <div class="card-body">
                        <h5 class="card-title">Camera</h5>
                        <p class="card-text">₹45,000</p>
                        <button class="btn btn-primary w-100">
                            Add to Cart
                        </button>
                    </div>
                </article>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <article class="card h-100 shadow-sm product-card">
                    <img
                        src="https://picsum.photos/id/160/500/350"
                        class="card-img-top"
                        alt="Smartwatch"
                    >

                    <div class="card-body">
                        <h5 class="card-title">Smartwatch</h5>
                        <p class="card-text">₹7,499</p>
                        <button class="btn btn-primary w-100">
                            Add to Cart
                        </button>
                    </div>
                </article>
            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">TechStore &copy; 2026</p>
    </footer>

</body>
</html>
