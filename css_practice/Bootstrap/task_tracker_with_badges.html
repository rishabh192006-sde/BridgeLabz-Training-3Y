<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Tracker</title>

    <!-- Bootstrap 5 CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="task_tracker_with_badges.css">
</head>

<body>

    <header class="bg-dark text-white py-4">
        <div class="container d-flex justify-content-between align-items-center">

            <div>
                <h1 class="mb-1">Task Tracker</h1>
                <p class="mb-0">Manage your daily tasks</p>
            </div>

            <!-- Badge counter -->
            <span class="badge bg-danger fs-6">
                4 Pending
            </span>

        </div>
    </header>

    <main class="container py-5">

        <section class="card shadow-sm">

            <div class="card-body">

                <h2 class="mb-4">
                    Today's Tasks
                </h2>

                <!-- Bootstrap list group -->
                <div class="list-group">

                    <div class="list-group-item d-flex justify-content-between align-items-center">

                        <span>
                            Complete HTML assignment
                        </span>

                        <span class="badge bg-danger">
                            High
                        </span>

                    </div>

                    <div class="list-group-item d-flex justify-content-between align-items-center">

                        <span>
                            Practice SQL queries
                        </span>

                        <span class="badge bg-warning text-dark">
                            Medium
                        </span>

                    </div>

                    <div class="list-group-item d-flex justify-content-between align-items-center">

                        <span>
                            Read Bootstrap documentation
                        </span>

                        <span class="badge bg-success">
                            Low
                        </span>

                    </div>

                    <div class="list-group-item d-flex justify-content-between align-items-center">

                        <span>
                            Update project README
                        </span>

                        <span class="badge bg-danger">
                            High
                        </span>

                    </div>

                </div>

                <!-- Button with embedded badge -->
                <button class="btn btn-primary mt-4">
                    Completed
                    <span class="badge bg-light text-dark ms-2">
                        2
                    </span>
                </button>

            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            Task Tracker &copy; 2026
        </p>
    </footer>

</body>
</html>
