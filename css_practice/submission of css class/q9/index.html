<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Combined CSS Effects</h1>
        <p>Pseudo-classes, transitions and transformations.</p>
    </header>

    <main>
        <section class="effects">

            <button class="effect-btn">Hover Me</button>

            <button class="effect-btn">Grow Me</button>

            <button class="effect-btn">Click Me</button>

            <a href="#" class="effect-link">Hover Link</a>

        </section>
    </main>

    <footer>
        <p>CSS Effects Demonstration</p>
    </footer>

</body>
</html>
