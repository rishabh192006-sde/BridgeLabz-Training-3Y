<!DOCTYPE html>
<html lang="en">
<head>

    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Photo Gallery</h1>

    <section class="gallery">

        <figure>

        <figure>
            <img src="https://picsum.photos/500/400?random=3" alt="Photo 3">

        </figure>

        <figure>
            <img src="https://picsum.photos/500/400?random=4" alt="Photo 4">
            <figcaption>Travel</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/500/400?random=5" alt="Photo 5">
            <figcaption>Forest</figcaption>
        </figure>

        <figure>
            <img src="https://picsum.photos/500/400?random=6" alt="Photo 6">
            <figcaption>Beach</figcaption>
        </figure>

    </section>

</body>
</html>
