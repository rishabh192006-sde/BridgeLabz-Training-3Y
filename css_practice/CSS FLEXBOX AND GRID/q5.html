<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Pricing Plans</h1>

    <section class="pricing">

        <div class="card">
            <h2>Basic</h2>
            <h3>₹499</h3>
            <p>Basic features</p>
            <p>Email support</p>
            <button>Choose Plan</button>
        </div>

        <div class="card popular">
            <h2>Standard</h2>
            <h3>₹999</h3>
            <p>All basic features</p>
            <p>Priority support</p>
            <button>Choose Plan</button>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <h3>₹1499</h3>
            <p>All standard features</p>
            <p>24/7 support</p>
            <button>Choose Plan</button>
        </div>

    </section>

</body>
</html>
