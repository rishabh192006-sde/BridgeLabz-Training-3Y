<!DOCTYPE html>
<html>
<head>
    <title>Links</title>

    <style>
        body {
            margin: 0;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 500px;
            margin: 50px auto;
            border: 1px solid #ddd;
            border-radius: 25px;
            overflow: hidden;
            text-align: center;
        }

        .title {
            background-color: #a8e6ed;
            padding: 40px;
            font-size: 50px;
            font-weight: bold;
        }

        .link {
            display: block;
            padding: 45px;
            font-size: 35px;
            border-top: 1px solid #ccc;
            text-decoration: none;
            color: black;
        }

        .contact {
            background-color: #80e0a0;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="title">Links</div>

        <a href="#" class="link">Home</a>
        <a href="#" class="link">About</a>
        <a href="#" class="link">Services</a>
        <a href="#" class="link contact">Contact</a>

    </div>

</body>
</html>
