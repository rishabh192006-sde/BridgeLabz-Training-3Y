<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="filter_cards_with_animation.css">
</head>
<body>

    <header>
        <h1>Profile Cards</h1>
    </header>

    <main>
        <section class="profiles">

            <article class="profile-card">
                <img class="gray-image"
                     src="https://i.pravatar.cc/400?img=12"
                     alt="Profile">
                <h2>Alex Johnson</h2>
                <p>Web Developer</p>
            </article>

            <article class="profile-card">
                <img class="sepia-image"
                     src="https://i.pravatar.cc/400?img=32"
                     alt="Profile">
                <h2>Sarah Wilson</h2>
                <p>UI Designer</p>
            </article>

            <article class="profile-card">
                <img class="gray-image"
                     src="https://i.pravatar.cc/400?img=56"
                     alt="Profile">
                <h2>David Smith</h2>
                <p>Data Analyst</p>
            </article>

        </section>
    </main>

    <footer>
        <p>Filter Cards Demonstration</p>
    </footer>

</body>
</html>
