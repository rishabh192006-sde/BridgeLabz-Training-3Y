<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Box Model</h1>
    </header>

    <main>

        <section class="demo">

            <div class="margin-layer">

                <div class="border-layer">

                    <div class="padding-layer">

                        <div class="content-layer">
                            Content
                        </div>

                    </div>

                </div>

            </div>

            <div class="description">
                <p><strong>Content:</strong> Actual information inside the element.</p>
                <p><strong>Padding:</strong> Space between content and border.</p>
                <p><strong>Border:</strong> Line surrounding padding and content.</p>
                <p><strong>Margin:</strong> Space outside the border.</p>
            </div>

        </section>

        <section class="box-sizing-demo">

            <div class="default-box">
                Default Box Sizing
            </div>

            <div class="border-box">
                Border Box
            </div>

        </section>

    </main>

    <footer>
        <p>CSS Box Model Practice</p>
    </footer>

</body>
</html>
