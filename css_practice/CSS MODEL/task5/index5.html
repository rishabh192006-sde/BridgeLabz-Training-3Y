<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main>
        <section class="selector-demo">

            <h2>Items</h2>

            <ul class="items">
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>React</li>
                <li>Node.js</li>
            </ul>

            <div class="links">
                <a href="https://example.com">Secure Link</a>
                <a href="http://example.com">Normal Link</a>
            </div>

            <form>
                <input type="text" placeholder="Enter your name">
                <input type="email" placeholder="Enter your email">
                <button type="submit">Submit</button>
            </form>

            <div class="parent">
                <p>Direct child paragraph</p>

                <div>
                    <p>Descendant paragraph</p>
                </div>

                <span>Next sibling element</span>

                <p>General sibling paragraph</p>
            </div>

        </section>
    </main>

    <footer>
        <p>Advanced Selector Practice</p>
    </footer>

</body>
</html>
