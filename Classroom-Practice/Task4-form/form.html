<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <h1 align="center">Student Registration Form</h1>

    <form>

        <table border="1" width="95%" align="center" cellpadding="12" cellspacing="0">

            <tr>
                <th colspan="2">Registration Form</th>
            </tr>

            <tr>
                <td>Full Name</td>
                <td>
                    <input type="text" name="name" placeholder="Enter your name">
                </td>
            </tr>

            <tr>
                <td>Email</td>
                <td>
                    <input type="email" name="email" placeholder="abc@gmail.com">
                </td>
            </tr>

            <tr>
                <td>Phone Number</td>
                <td>
                    <input type="tel" name="phone" placeholder="9876543210">
                </td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="date" name="dob">
                </td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                </td>
            </tr>

            <tr>
                <td>Skills</td>
                <td>
                    <input type="checkbox" id="html" name="skill" value="HTML">
                    <label for="html">HTML</label>

                    <input type="checkbox" id="css" name="skill" value="CSS">
                    <label for="css">CSS</label>

                    <input type="checkbox" id="javascript" name="skill" value="JavaScript">
                    <label for="javascript">JavaScript</label>
                </td>
            </tr>

            <tr>
                <td>Course</td>
                <td>
                    <select name="course">
                        <option>--Select Course--</option>
                        <option>B.Tech CSE</option>
                        <option>B.Tech AI & DS</option>
                        <option>BCA</option>
                        <option>MCA</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td>
                    <textarea name="address" rows="5" cols="35"></textarea>
                </td>
            </tr>

            <tr>
                <td>Upload Resume</td>
                <td>
                    <input type="file" name="resume">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <button type="submit">Register</button>
                    <button type="reset">Reset</button>
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
